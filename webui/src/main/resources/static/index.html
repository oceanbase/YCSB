<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YCSB-OBKV Platform</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="themes.css">
</head>
<body>
<header class="header">
  <div class="header-left">
    <span class="logo">YCSB-OBKV Platform</span>
    <select id="moduleSelect" class="module-select"></select>
  </div>
  <div class="nav-block">
    <nav class="nav">
      <button class="nav-btn" data-tab="table">建表向导</button>
      <button class="nav-btn active" data-tab="test">性能测试</button>
      <button class="nav-btn" data-tab="history">历史记录</button>
    </nav>
  </div>
  <div class="header-right">
    <button id="themeToggle" class="btn btn-sm" title="切换深色/浅色">🌓</button>
  </div>
</header>

<!-- Config bar -->
<div class="config-bar">
  <button id="newConfigBtn" class="btn btn-sm">新建配置</button>
  <span class="label">已保存：</span>
  <select id="savedConfigSelect" class="select-sm"><option value="">-- 选择配置 --</option></select>
  <button id="loadConfigBtn" class="btn btn-sm">加载</button>
  <button id="saveConfigBtn" class="btn btn-sm">另存为</button>
  <button id="deleteConfigBtn" class="btn btn-sm btn-danger">删除</button>
  <button id="previewConfigBtn" class="btn btn-sm" title="预览当前配置">预览配置</button>
  <span id="configBarStopSlot" class="config-bar-stop-slot"></span>
</div>

<!-- Main content -->
<main class="main-content">

  <!-- ==================== Test Tab ==================== -->
  <section id="tab-test" class="tab-section active">
    <div class="split-layout">
      <div class="config-panel-wrapper" id="configPanelWrapper">
      <aside class="config-panel" id="configPanel">
        <div class="config-panel-body">
        <div class="panel-section" data-section="step1">
          <h3 class="section-title">Step 1 · 连接配置<button type="button" class="section-toggle" title="收起/展开" aria-label="收起/展开">−</button></h3>
          <div class="panel-section-body">
          <div class="toggle-row">
            <label>连接方式：</label>
            <div class="toggle-group" id="connModeToggle">
              <button class="toggle-btn active" data-mode="direct">直连模式</button>
              <button class="toggle-btn" data-mode="odp">ODP 模式</button>
            </div>
          </div>
          <div id="connFields" class="fields-grid"></div>
          </div>
        </div>

        <div class="panel-section" data-section="step2">
          <h3 class="section-title">Step 2 · 测试模式<button type="button" class="section-toggle" title="收起/展开" aria-label="收起/展开">−</button></h3>
          <div class="panel-section-body">
          <div id="tableModeFields"></div>
          </div>
        </div>

        <div class="panel-section" data-section="step3">
          <h3 class="section-title">Step 3 · 测试参数<button type="button" class="section-toggle" title="收起/展开" aria-label="收起/展开">−</button></h3>
          <div class="panel-section-body">
          <div id="testTypeButtons" class="btn-group"></div>
          <div id="workloadFields" class="fields-grid mt-8"></div>
          <div id="extraFields" class="fields-grid"></div>
          </div>
        </div>

        <div class="panel-section" data-section="step4">
          <h3 class="section-title">Step 4 · 自定义参数
            <button id="addCustomParamBtn" class="btn btn-sm">+ 添加</button>
            <button type="button" class="section-toggle" title="收起/展开" aria-label="收起/展开">−</button>
          </h3>
          <div class="panel-section-body">
          <div id="customParamsContainer">
            <div class="custom-param-header">
              <span>参数名</span><span>参数值</span><span></span>
            </div>
            <div id="customParamRows"></div>
          </div>
          <p class="hint">自定义参数会覆盖上方同名参数</p>
          </div>
        </div>

        <div class="panel-actions">
          <div id="launchButtonsWrap">
            <button id="startTestBtn" class="btn btn-primary btn-lg">▶ 发起新测试</button>
          </div>
        </div>
        </div>
      </aside>
      <button type="button" id="configPanelToggle" class="config-panel-toggle" title="收起配置栏" aria-label="收起配置栏">◀</button>
      </div>
      <div class="resize-handle" id="resizeHandle" title="拖动调整宽度"></div>
      <div class="right-panel">
        <div class="sessions-bar">
          <div id="sessionTabs" class="session-tabs"></div>
        </div>

        <div id="sessionContent" class="session-content">
          <div class="no-session-hint">
            <p>在左侧填写配置，点击「▶ 发起新测试」开始测试</p>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- ==================== Table Tab ==================== -->
  <section id="tab-table" class="tab-section">
    <div class="table-wizard">
      <div class="config-panel">
        <div class="panel-section">
          <h3 class="section-title">建表参数</h3>
          <div id="tableCreateFields" class="fields-grid"></div>
        </div>
        <div class="panel-actions">
          <button id="generateSqlBtn" class="btn btn-primary">生成 SQL</button>
        </div>
      </div>

      <div class="sql-panel">
        <div class="panel-section">
          <h3 class="section-title">生成的 SQL
            <button id="copySqlBtn" class="btn btn-xs">复制</button>
          </h3>
          <textarea id="sqlPreview" class="sql-textarea" readonly placeholder="点击「生成 SQL」查看建表语句…"></textarea>
        </div>
        <div class="panel-section">
          <h3 class="section-title">执行建表</h3>
          <label class="field-label" style="grid-column:1/-1;">
            <input type="checkbox" id="dropIfExists" checked> 如果表存在先删除表，再建表
          </label>
          <div class="fields-grid" id="dbConnFields">
            <label class="field-label">主机</label>
            <input id="dbHost" type="text" class="field-input" placeholder="127.0.0.1">
            <label class="field-label">端口</label>
            <input id="dbPort" type="number" class="field-input" value="2881">
            <label class="field-label">用户名</label>
            <input id="dbUser" type="text" class="field-input" placeholder="root@test">
            <label class="field-label">密码</label>
            <input id="dbPass" type="password" class="field-input">
            <label class="field-label">数据库</label>
            <input id="dbName" type="text" class="field-input" placeholder="test">
          </div>
          <div class="btn-row mt-8">
            <button id="testConnBtn" class="btn">测试连接</button>
            <button id="executeSqlBtn" class="btn btn-primary">执行建表</button>
          </div>
          <div id="sqlExecResult" class="result-msg mt-8"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- ==================== History Tab ==================== -->
  <section id="tab-history" class="tab-section">
    <div class="history-layout">
      <div class="history-list-panel">
        <div class="history-filters">
          <select id="filterModule" class="select-sm">
            <option value="">全部模块</option>
          </select>
          <select id="filterStatus" class="select-sm">
            <option value="">全部状态</option>
            <option value="COMPLETED">完成</option>
            <option value="RUNNING">运行中</option>
            <option value="FAILED">失败</option>
            <option value="STOPPED">已停止</option>
          </select>
          <button id="refreshHistoryBtn" class="btn btn-sm">刷新</button>
        </div>
        <div id="historyList" class="history-list"></div>
        <div class="history-pagination">
          <button id="historyPrevBtn" class="btn btn-sm" disabled>‹ 上一页</button>
          <span id="historyPageInfo">第 1 页</span>
          <button id="historyNextBtn" class="btn btn-sm">下一页 ›</button>
        </div>
      </div>
      <div id="historyDetail" class="history-detail">
        <div class="no-session-hint"><p>选择左侧历史记录查看详情</p></div>
      </div>
    </div>
  </section>

</main>

<!-- Save config modal -->
<div id="saveModal" class="modal hidden">
  <div class="modal-box">
    <h3>另存为配置</h3>
    <p class="hint">名称只允许字母、数字、下划线、连字符（1-100位）</p>
    <input id="saveConfigName" type="text" class="field-input" placeholder="my-read-test">
    <div id="saveModalError" class="error-msg"></div>
    <div class="btn-row mt-8">
      <button id="saveModalConfirm" class="btn btn-primary">保存</button>
      <button id="saveModalCancel" class="btn">取消</button>
    </div>
  </div>
</div>
<!-- Config preview modal（复用右侧配置预览展示逻辑） -->
<div id="previewConfigModal" class="modal hidden">
  <div class="modal-box modal-box-wide">
    <h3>配置预览</h3>
    <pre id="previewConfigContent" class="preview-config-content"></pre>
    <div class="btn-row mt-8">
      <button id="previewConfigClose" class="btn btn-primary">关闭</button>
    </div>
  </div>
</div>
<div id="modalOverlay" class="modal-overlay hidden"></div>

<script src="vendor-chart.umd.min.js"></script>
<script src="sse.js"></script>
<script src="chart.js"></script>
<script src="config.js"></script>
<script src="table.js"></script>
<script src="test.js"></script>
<script src="history.js"></script>
<script src="app.js"></script>
</body>
</html>

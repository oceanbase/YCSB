server.port=8080

# Directory paths (relative to working directory, or absolute)
webui.configs.dir=webui-configs
webui.runs.dir=webui-runs

# obkv-hbase module
webui.hbase.jar.path=obkv-hbase/build/obkv-hbase-0.18.0-SNAPSHOT-jar-with-dependencies.jar
webui.hbase.workdir=obkv-hbase

# obkv-table module
# Note: obkv-table/build.sh copies the JAR as "1.0-SNAPSHOT" naming; adjust if your build differs
webui.table.jar.path=obkv-table/build/obkv-table-1.0-SNAPSHOT-jar-with-dependencies.jar
webui.table.workdir=obkv-table

# YCSB subprocess JVM heap limit
webui.ycsb.jvm.max-heap=512m

# Maximum number of concurrent test runs
webui.max.concurrent.tests=5

# SSE dedicated thread pool size
webui.sse.thread-pool-size=20

# Maximum number of historical run records to keep (oldest deleted when exceeded)
webui.runs.max-count=100

# Spring MVC async request timeout (0 = no timeout, needed for SSE)
spring.mvc.async.request-timeout=-1

# Disable Tomcat connection timeout for SSE long-lived connections
server.tomcat.connection-timeout=0
